version: 2.0
title: "Agentic Runtime Security with AgentCore and Vault"
description: >-
  Deploy a hands-on implementation of runtime AI agent security using Amazon
  Bedrock AgentCore and HashiCorp Vault Enterprise. Agents authenticate with
  JWTs, Gateway brokers scoped access to protected resources, and Vault vends
  short-lived dynamic credentials — no standing privileges, full audit trail.
duration: 120
level: 300
authors:
  - Jonathan Hurley
  - Oscar Medina
